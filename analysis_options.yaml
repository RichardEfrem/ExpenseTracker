include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/generated/**"
    # drift_dev migration test helpers (`drift_dev schema generate`).
    - "test/core/database/migrations/schema.dart"
    - "test/core/database/migrations/schema_v*.dart"
    - "build/**"

linter:
  rules:
    always_use_package_imports: true
    prefer_const_constructors: true
    avoid_dynamic_calls: true
    unawaited_futures: true
